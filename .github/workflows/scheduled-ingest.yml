name: Scheduled ingest

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC — weekly playlist refresh
    - cron: "*/30 * * * *"  # Every 30 minutes — Spotify recently-played
    - cron: "0 3 * * *"    # Daily 03:00 UTC — Spotify liked songs sync
    - cron: "30 3 * * *"  # Daily 03:30 UTC — Spotify track metadata enrichment
    - cron: "50 3 * * *"  # Daily 03:50 UTC — track popularity score computation
    - cron: "55 3 * * *"  # Daily 03:55 UTC — artist popularity score computation
    - cron: "0 4 * * *"   # Daily 04:00 UTC — sweep expired custom playlists
    - cron: "0 5 * * *"   # Daily 05:00 UTC — create period snapshots (month/season/year/decade)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Weekly playlist refresh
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    concurrency:
      group: scheduled-ingest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh playlist
        if: success()
        run: uv run python scripts/update_managed_playlists.py --fresh-ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

  spotify-recent:
    name: Spotify recently-played ingest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: spotify-recent
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run python scripts/ingest_spotify_recent.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

  sync-liked-songs:
    name: Spotify liked songs sync
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: sync-liked-songs
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Sync liked songs
        run: uv run python scripts/sync_liked_songs.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

  enrich-track-metadata:
    name: Spotify track metadata enrichment
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: enrich-track-metadata
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Enrich track metadata
        run: uv run python scripts/enrich_track_metadata.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

  compute-track-popularity:
    name: Track popularity score computation
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '50 3 * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: compute-track-popularity
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compute track popularity scores
        run: uv run python scripts/compute_track_popularity_scores.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  compute-artist-popularity:
    name: Artist popularity score computation
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '55 3 * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: compute-artist-popularity
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compute artist popularity scores
        run: uv run python scripts/compute_artist_popularity_scores.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  sweep-expired-custom-playlists:
    name: Sweep expired custom playlists
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Sweep expired custom playlists
        run: uv run python scripts/sweep_expired_custom_playlists.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

  create-snapshots:
    name: Create period snapshots
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: create-snapshots
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create snapshots
        run: uv run python scripts/create_snapshots.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
