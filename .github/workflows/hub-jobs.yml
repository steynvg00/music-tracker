name: Hub jobs

# Rotor hub jobs (v0.82, R2): work the hub asks Python to do.
#
# Dispatched by the hub with a hub_jobs row id (needs the hub's GITHUB_DISPATCH_TOKEN):
#   reseed_daily_pick  "Shuffle the deck"                 (DB only)
#   refresh_managed    "Refresh this playlist now" / Rebuild (writes ONE Auto playlist,
#                      after a live owner + ' · Auto' suffix check, lib/managed_refresh.py)
#   push_test          "Send a test notification"
# scripts/run_hub_job.py claims the row atomically (queued → running), so a duplicate
# dispatch does nothing, and reports done/failed back to the row.
#
# Daily (schedule, or "Run workflow" with an empty job_id): stale-job sweep, pending
# snapshot rebuilds, "Today's pick is ready" + token-expiry notifications, rules catalog.
#
# Deliberately NOT a job in scheduled-ingest.yml: every job there also runs on
# workflow_dispatch. Listed in keepalive.yml because the daily schedule makes it a
# scheduled workflow that GitHub would disable after 60 days without activity.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "hub_jobs.id (uuid), set by the hub. Leave empty to run the daily tasks."
        required: false
        default: ""
        type: string
  schedule:
    # 05:47 UTC = 06:47 / 07:47 Amsterdam: after the 04:30 daily-pick generator.
    - cron: "47 5 * * *"

permissions:
  contents: read

concurrency:
  # One group per job id: GitHub cancels pending runs in a shared group, which would strand queued jobs.
  group: hub-jobs-${{ inputs.job_id || 'daily' }}
  cancel-in-progress: false

jobs:
  run:
    name: Run hub job
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate job id
        if: ${{ inputs.job_id }}
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::not a job id"; exit 1; }

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run job
        if: ${{ inputs.job_id }}
        run: uv run python scripts/run_hub_job.py
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      - name: Daily tasks
        if: ${{ !inputs.job_id }}
        run: uv run python scripts/run_hub_job.py --daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
