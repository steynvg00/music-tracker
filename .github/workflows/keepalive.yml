name: Keepalive

# GitHub disables a public repository's scheduled workflows after 60 days without
# repository activity, and scheduled runs themselves do not count as activity.
# This workflow re-enables every scheduled workflow through the REST API
# ("Enable a workflow" sets its state to active), which resets that inactivity
# counter without creating any commit.
#
# Why it exists: on 2026-09-11 every cron in scheduled-ingest.yml was found to
# have been silent since ~6 September, because the last push to the repo was in
# July. Roughly 5.5 days of listening history were lost for good —
# /me/player/recently-played only returns the last 50 tracks.
#
# Why not an empty commit: the first version (v0.77) pushed one to main every
# month, but main's ruleset only accepts changes through a pull request, so every
# run was rejected with GH013 and nothing ever reset the timer.
#
# The verify step fails the run (and GitHub emails a failure) if any of the listed
# workflows is not active (hub-jobs.yml joined in v0.82: it has a daily schedule). keepalive.yml re-enables itself as well, because it is
# a scheduled workflow too and would otherwise be disabled along with the others.
#
# Deliberately a separate workflow file rather than a job inside
# scheduled-ingest.yml, so that a failure in either one cannot take down the other.

on:
  schedule:
    # Weekly, Mondays at 07:17 UTC. Minute 17 stays clear of the every-30-minutes
    # Spotify ingest (which fires on :00 and :30 of every hour), and 07:00 is past
    # the 03:00-06:00 band and the Monday 06:00 weekly refresh. Weekly instead of
    # monthly: a run costs seconds, and a few missed runs still stay far inside 60 days.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Re-enable scheduled workflows
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOWS: scheduled-ingest.yml ingest-monitor.yml hub-jobs.yml keepalive.yml

    steps:
      - name: Re-enable workflows
        run: |
          for wf in $WORKFLOWS; do
            gh api --method PUT "repos/$REPO/actions/workflows/$wf/enable"
            echo "Re-enabled $wf"
          done

      - name: Verify all workflows are active
        run: |
          failed=0
          for wf in $WORKFLOWS; do
            state="$(gh api "repos/$REPO/actions/workflows/$wf" --jq .state)"
            echo "$wf: $state"
            if [ "$state" != "active" ]; then
              echo "::error::$wf is '$state', expected 'active'"
              failed=1
            fi
          done
          exit "$failed"
